apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// UnicodeTables.java is not stored in git. Generate it when missing or older than the generator, or on demand with -PupdateUnicode.
def unicodeTables = file('src/main/java/com/termux/terminal/UnicodeTables.java')
def unicodeGenerator = new File(rootProject.projectDir, 'tools/unicode/generate_unicode.py')
if (!unicodeTables.exists() || unicodeTables.lastModified() < unicodeGenerator.lastModified() || project.hasProperty('updateUnicode')) {
    def generator = new ProcessBuilder('python3', 'tools/unicode/generate_unicode.py')
            .directory(rootProject.projectDir)
            .redirectErrorStream(true)
            .start()
    generator.inputStream.eachLine { line -> logger.lifecycle(line) }
    if (generator.waitFor() != 0 || !unicodeTables.exists()) {
        throw new GradleException('Cannot generate UnicodeTables.java, python3 and access to unicode.org are needed. ' +
                'Run python3 tools/unicode/generate_unicode.py by hand.')
    }
}

android {
    namespace "com.termux.emulator"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.118.0'
                artifact(sourceJar)
            }
        }
    }
}
